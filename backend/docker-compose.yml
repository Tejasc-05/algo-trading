services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algoflow}
      POSTGRES_DB: ${POSTGRES_DB:-algoflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algoflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_LOCAL_FINBERT: "1"
    env_file:
      - .env
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - finbert_cache:/models

  paper_worker:
    build: .
    env_file: [.env]
    entrypoint: ["python", "-m", "app.paper_trading.worker"]
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  futures_demo_worker:
    build: .
    env_file: [.env]
    entrypoint: ["python", "-m", "app.futures.worker"]
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  finbert_cache:
