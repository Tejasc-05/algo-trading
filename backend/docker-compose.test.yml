# Disposable integration infrastructure. No application or exchange workers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: algoflow_test
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DB: algoflow_readiness_test
    ports: ["127.0.0.1:15439:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U algoflow_test -d algoflow_readiness_test"]
      interval: 2s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16389:6379"]
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 20
