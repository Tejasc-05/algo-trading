name: AlgoFlow checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: pip install -r requirements.txt -r requirements-quant.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: pip check
      - run: pip install pip-audit && pip-audit --local
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=low
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algoflow_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: algoflow_readiness_test
        ports: ['15439:5432']
        options: >-
          --health-cmd "pg_isready -U algoflow_test -d algoflow_readiness_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['16389:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: pip install -r backend/requirements.txt -r backend/requirements-quant.txt
      - run: python -m pytest -c backend/integration/pytest.ini -q backend/integration
